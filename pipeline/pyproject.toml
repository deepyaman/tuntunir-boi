[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tuntunir_boi"
description = "Kedro pipelines that derive audio (and later glossaries) for the stories"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "huggingface-hub",
    "kedro~=1.7.0",
    "kedro-datasets~=9.6",
    "numpy",
    "snac",
    "soundfile",
    "torch",
    "transformers>=5",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D1"] # docstrings where they help, not on every function

[tool.ruff.lint.pydocstyle]
convention = "google"

# CI runs on Linux without a GPU; PyTorch's CPU index keeps the CUDA builds out.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.setuptools.dynamic.version]
attr = "tuntunir_boi.__version__"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.kedro]
package_name = "tuntunir_boi"
project_name = "Tuntunir Boi"
kedro_init_version = "1.7.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"
