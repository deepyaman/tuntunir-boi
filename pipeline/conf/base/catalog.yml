# Datasets. See https://docs.kedro.org/en/stable/catalog-data/introduction/
#
# Every run handles one story: `kedro run --params story=01-tuntuni-ar-biraler-kotha`.
# Inputs come from, and final outputs go to, that story's directory in the site;
# intermediates stay in data/ (not committed).

source_bn:
  type: text.TextDataset
  filepath: ../src/stories/${runtime_params:story}/source.bn.md

paragraphs:
  type: json.JSONDataset
  filepath: data/${runtime_params:story}/paragraphs.json
  save_args:
    ensure_ascii: false
    indent: 1

tts_model:
  type: tuntunir_boi.datasets.IndicSpeakDataset
  model: ${globals:tts_model}
  revision: ${globals:tts_revision}

paragraph_wavs:
  type: partitions.PartitionedDataset
  path: data/${runtime_params:story}/wav
  dataset: tuntunir_boi.datasets.WAVDataset
  filename_suffix: .wav

aligner:
  type: tuntunir_boi.datasets.MMSAlignerDataset

timings:
  type: json.JSONDataset
  filepath: ../src/stories/${runtime_params:story}/audio/timings.json
  save_args:
    ensure_ascii: false
    indent: 1

paragraph_clips:
  type: partitions.PartitionedDataset
  path: ../src/stories/${runtime_params:story}/audio
  dataset: tuntunir_boi.datasets.AACDataset
  filename_suffix: .m4a
