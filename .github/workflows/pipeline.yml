name: Pipeline

on:
  push:
    branches: [main]
    paths: ['pipeline/**', 'src/stories/*/source.bn.md', .github/workflows/pipeline.yml]
  pull_request:
    paths: ['pipeline/**', 'src/stories/*/source.bn.md', .github/workflows/pipeline.yml]

defaults:
  run:
    working-directory: pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: pipeline
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest
